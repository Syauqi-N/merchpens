# ===========================================================================
# Pengaturan bersama untuk semua server block (dimuat pada konteks http).
# Berkas di folder ini dibaca berurutan sesuai abjad, makanya diberi awalan 00.
# ===========================================================================

# DNS bawaan Docker. Alamat 127.0.0.11 selalu tersedia di dalam jaringan
# buatan Docker Compose.
#
# Kenapa penting: nama "app" diterjemahkan ke alamat IP SETIAP KALI ada
# permintaan masuk (bukan sekali saat nginx menyala). Tanpa ini, setiap kali
# container app dibangun ulang — misalnya waktu memasang pembaruan — alamat
# IP-nya berubah, nginx masih memegang alamat lama, dan situs balas 502
# sampai nginx ikut di-restart manual.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# Jangan bocorkan versi nginx di header Server.
server_tokens off;

# Batas ukuran unggahan. Panel admin membatasi gambar 5 MB; angka di sini
# dibuat sedikit lebih longgar supaya pesan galat datang dari aplikasi
# (berbahasa Indonesia) dan bukan halaman 413 bawaan nginx.
client_max_body_size 12m;

# --- Header proxy standar --------------------------------------------------
# Diwariskan ke semua server/location di bawah, kecuali ditimpa secara khusus.
#
# X-Forwarded-For WAJIB ada: kode webhook Duitku membaca IP pengirim dari
# header ini. X-Forwarded-Proto juga wajib supaya Auth.js tahu permintaan
# aslinya lewat HTTPS (dipasangkan dengan AUTH_TRUST_HOST=true di .env).
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;

# --- Kompresi --------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   512;
gzip_types        text/plain
                  text/css
                  text/javascript
                  application/javascript
                  application/json
                  application/manifest+json
                  application/xml
                  image/svg+xml
                  font/woff2;
