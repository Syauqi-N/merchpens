# ===========================================================================
# Reverse proxy HTTP (port 80) untuk aplikasi toko.
#
# YANG HARUS KAMU GANTI: semua tulisan "domain-kamu.com" di bawah ini
# (ada juga di app-ssl.conf.example) diganti dengan domain toko yang asli.
# Sebelum domain siap, kamu tetap bisa mengaksesnya lewat IP VPS.
#
# Setelah mengubah berkas ini, periksa dan muat ulang:
#   docker compose -f docker-compose.prod.yml exec nginx nginx -t
#   docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
# ===========================================================================

server {
    listen 80;

    # GANTI dengan domainmu, mis: dentalstore.co.id www.dentalstore.co.id
    server_name domain-kamu.com www.domain-kamu.com;

    # Nama layanan "app" di jaringan Docker Compose, port 3000. Port itu tidak
    # dipublikasikan ke internet — hanya nginx yang bisa menghubunginya.
    # Ditulis sebagai variabel supaya nginx menerjemahkan namanya lewat DNS
    # Docker setiap saat (lihat penjelasan di 00-common.conf).
    set $app_upstream "app:3000";

    # --- Let's Encrypt (verifikasi kepemilikan domain) ---------------------
    # Certbot menaruh berkas tantangan di folder ini lewat volume bersama.
    # Blok ini WAJIB tetap dilayani lewat HTTP polos, bahkan setelah HTTPS
    # aktif, supaya perpanjangan sertifikat otomatis tidak gagal.
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
        access_log   off;
    }

    # --- Webhook Duitku ----------------------------------------------------
    # Jalur uang. Diteruskan apa adanya: tanpa buffering, tanpa percobaan
    # ulang ke upstream lain, dengan tenggang waktu longgar.
    location = /api/duitku/callback {
        proxy_pass http://$app_upstream$request_uri;

        # PENTING: begitu satu blok memakai proxy_set_header, SELURUH header
        # yang diatur di 00-common.conf tidak lagi diwariskan ke blok ini.
        # Karena itu semuanya ditulis ulang lengkap di sini — kalau tidak,
        # Duitku akan menerima Host "app:3000" dan aplikasi kehilangan
        # informasi bahwa permintaan aslinya lewat HTTPS.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # Kode server mencocokkan IP pengirim dengan daftar IP resmi Duitku
        # dari entri PERTAMA header X-Forwarded-For. Di sini header itu
        # sengaja DITIMPA dengan alamat peer sebenarnya, supaya pihak luar
        # tidak bisa berpura-pura menjadi Duitku hanya dengan mengirim
        # header X-Forwarded-For buatan sendiri.
        # CATATAN: kalau nanti kamu memasang Cloudflare/CDN di depan VPS,
        # ganti baris ini menjadi $proxy_add_x_forwarded_for.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_request_buffering off;
        proxy_buffering         off;
        proxy_next_upstream     off;
        proxy_read_timeout      180s;
        proxy_send_timeout      180s;
    }

    # --- Gambar unggahan panel admin ---------------------------------------
    # DILAYANI LANGSUNG OLEH NGINX, sengaja TIDAK diteruskan ke aplikasi.
    #
    # Kenapa harus begini? Server produksi Next mendata isi folder public/
    # hanya SEKALI, saat server menyala. Gambar yang diunggah pengurus saat
    # aplikasi sedang jalan tidak ikut terdata, jadi kalau permintaannya
    # diteruskan ke Next hasilnya 404 sampai container di-restart — gejalanya:
    # "unggah gambar berhasil, tapi gambarnya kosong di halaman produk".
    #
    # nginx membaca berkasnya langsung dari volume "uploads", yang dipasang
    # read-only di /var/www/uploads (lihat layanan nginx di
    # docker-compose.prod.yml). Volume yang sama dipasang read-write di
    # /app/public/uploads pada layanan app, yaitu tempat
    # src/app/api/upload/route.ts menulis berkasnya.
    #
    # "^~" berarti: begitu awalan ini cocok, nginx berhenti mencari location
    # lain — jadi blok "location /" di bawah tidak akan pernah kebagian.
    location ^~ /uploads/ {
        alias /var/www/uploads/;

        # Nama berkas selalu UUID + ".webp" dan isinya tidak pernah berubah,
        # jadi aman di-cache lama di browser.
        #
        # SENGAJA tanpa "always": header ini hanya ditempel pada respons yang
        # berhasil. Kalau dipasang "always", respons 404 sementara — misalnya
        # saat volume uploads sedang dipulihkan dari backup — ikut tersimpan di
        # cache browser selama 30 hari dan gambarnya seolah-olah hilang permanen.
        add_header Cache-Control "public, max-age=2592000, immutable";

        # Jangan pernah menampilkan daftar isi folder.
        autoindex off;

        # Berkas tidak ada -> 404 biasa, bukan diteruskan ke aplikasi.
        try_files $uri =404;

        access_log off;
    }

    # --- Sisanya diteruskan ke aplikasi Next -------------------------------
    location / {
        # ALIHKAN KE HTTPS: hapus tanda # pada baris di bawah SETELAH
        # sertifikat terbit dan app-ssl.conf.example sudah kamu ganti namanya
        # menjadi app-ssl.conf.
        #
        # Perhatikan: pengalihan ini sengaja ditaruh DI DALAM "location /",
        # bukan langsung di bawah "server {". Kalau ditaruh di tingkat server,
        # nginx menjalankannya SEBELUM memilih location, sehingga permintaan
        # ke /.well-known/acme-challenge/ ikut dialihkan ke https — dan
        # perpanjangan otomatis sertifikat Let's Encrypt jadi gagal diam-diam
        # setiap 90 hari.
        #
        # return 301 https://$host$request_uri;

        proxy_pass http://$app_upstream$request_uri;
    }
}
